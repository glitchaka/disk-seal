name: disk-seal verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Normalize formatting before verification
        run: cargo fmt --all
      - name: Compile and execute tests
        run: cargo test --all-targets --verbose
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Windows native CLI smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run --quiet -- inspect | ConvertFrom-Json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo inspeccionar el soporte' }
          # Expected negative test: a missing seal MUST fail. Prevent pwsh's
          # native-command error preference from aborting before assertion.
          $PSNativeCommandUseErrorActionPreference = $false
          cargo run --quiet -- verify sst "$env:WINDIR\System32\notepad.exe" "missing.seal" *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Se aceptó una instalación sin sello' }
          # GitHub's pwsh wrapper exits with LASTEXITCODE by default.
          # The negative test succeeded, so explicitly reset the step status.
          exit 0
