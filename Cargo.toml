[package]
name = "disk-seal"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Portable storage identity seal for Windows; independent of SST licenses"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO"
] }
